# Builds the linux ffmpeg binaries this project bundles, from source, fully static.
#
# Why build at all: the static builds this project has always used are no longer
# reachable, and every other publisher ships dynamically linked binaries. BtbN needs
# glibc 2.28, ffmpeg.martin-riedl.de needs 2.35, and neither offers 32 bit arm.
# Bundling those would drop older distributions and musl based images, which work now.
#
# Why musl: linking against musl inside alpine produces a binary with no interpreter
# and no libc dependency at all, so it runs on any linux, glibc distributions and musl
# containers alike. That is a stronger guarantee than the glibc static builds this
# project used before.
#
# Alpine is driven through docker rather than the container: key, because the
# javascript actions need a node that will not run on musl. The build happens in the
# container, and so does every check, in a glibc debian of the same architecture, so
# arm binaries can be exercised on an x86 runner through qemu.

name: Build linux ffmpeg

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'ffmpeg release to build'
        required: false
        default: '9.0.1'
      alpine_version:
        description: 'alpine image to build in'
        required: false
        default: '3.21'

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            emulated: false
            output: ffmpeg-amd64
            module: jave-nativebin-linux64
            encoders: libx264 libx265 libmp3lame aac libvorbis flac mpeg4 libopus libvpx-vp9
            allowed_losses: libspeex sonic sonicls ayuv v308 v408 v410
          - arch: arm64
            platform: linux/arm64
            # Native arm runner, free for public repositories. Emulating this one
            # would turn twenty minutes into hours for no reason.
            runner: ubuntu-24.04-arm
            emulated: false
            output: ffmpeg-aarch64
            module: jave-nativebin-arm64
            encoders: libx264 libx265 libmp3lame aac libvorbis flac mpeg4 libopus libvpx-vp9
            allowed_losses: libspeex sonic sonicls ayuv v308 v408 v410
          - arch: arm32
            platform: linux/arm/v7
            # There is no 32 bit arm runner, so this one goes through qemu and is
            # far slower than the others
            runner: ubuntu-latest
            emulated: true
            output: ffmpeg-arm
            module: jave-nativebin-arm32
            # No x265. It neither compiles nor links on 32 bit arm, and the 4.4
            # build being replaced there never had it either.
            encoders: libx264 libmp3lame aac libvorbis flac mpeg4 libopus libvpx-vp9
            # The vaapi encoders go too. Vaapi is the intel and amd desktop gpu
            # interface and has no driver on 32 bit arm boards, while this build
            # gains hevc_v4l2m2m, which is the path those boards actually use.
            allowed_losses: libspeex sonic sonicls ayuv v308 v408 v410 h264_vaapi hevc_vaapi mjpeg_vaapi mpeg2_vaapi vp8_vaapi vp9_vaapi

    steps:
      - uses: actions/checkout@v5

      - name: Set up qemu, this architecture has no runner of its own
        if: matrix.emulated
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.platform }}

      - name: Build ffmpeg ${{ inputs.ffmpeg_version }} for ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p out

          docker run --rm --platform "${{ matrix.platform }}" \
            -v "$PWD/out:/out" \
            -v "$PWD/.github/scripts/build-ffmpeg-static.sh:/build.sh:ro" \
            -e FFMPEG_VERSION="${{ inputs.ffmpeg_version }}" \
            -e OUTPUT_NAME="${{ matrix.output }}" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            "alpine:${{ inputs.alpine_version }}" \
            sh /build.sh

          ls -l out/

      - name: It must be static, or it is no use to us
        run: |
          set -euo pipefail
          description=$(file -b "out/${{ matrix.output }}")
          echo "file: $description"

          if ! echo "$description" | grep -q "statically linked"; then
            echo "::error::not statically linked, this would break musl images and older distributions"
            exit 1
          fi
          if echo "$description" | grep -q "interpreter"; then
            echo "::error::names an interpreter, so it is not self contained"
            exit 1
          fi
          echo "OK, self contained"

      - name: Exercise it on glibc, where it claims to need nothing
        run: |
          set -euo pipefail
          bundled="${{ matrix.module }}/src/main/resources/ws/schild/jave/nativebin/${{ matrix.output }}"
          chmod +x "$bundled" "out/${{ matrix.output }}"

          # Debian rather than alpine on purpose. A musl static binary is supposed to
          # run on glibc without asking for anything, and this is where that is proven.
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "$PWD:/w" -w /w debian:12-slim bash -euo pipefail -c '
              new="out/${{ matrix.output }}"
              old="'"$bundled"'"
              fail=0

              echo "=== it runs ==="
              # Not piped into head. head leaves after two lines, ffmpeg takes SIGPIPE
              # and pipefail turns that into a failed step, which is a race that depends
              # on how fast ffmpeg writes.
              "$new" -version > /tmp/version.txt
              head -2 /tmp/version.txt

              # Ask once and search the answers. Piping ffmpeg into grep -q means grep
              # leaves as soon as it matches, ffmpeg dies of SIGPIPE, and pipefail
              # reports the whole thing as failed, so an early match looks like a miss.
              "$new" -hide_banner -protocols > /tmp/protocols.txt 2>/dev/null
              "$new" -hide_banner -encoders  > /tmp/encoders.txt  2>/dev/null
              "$new" -hide_banner -filters   > /tmp/filters.txt   2>/dev/null

              echo "=== https, needed for MultimediaObject on a URL ==="
              if grep -qw https /tmp/protocols.txt; then
                echo "  https present"
              else
                echo "::error::no https protocol, remote sources would stop working"; fail=1
              fi

              echo "=== encoders and filters the test suite exercises ==="
              for enc in ${{ matrix.encoders }}; do
                if grep -qw -- "$enc" /tmp/encoders.txt; then
                  echo "  encoder $enc"
                else
                  echo "::error::encoder missing: $enc"; fail=1
                fi
              done
              # subtitles comes from libass and drawtext from freetype plus harfbuzz,
              # which ffmpeg has required for it since 7.x. Both have their own tests
              # in the suite, and the first build of this shipped without drawtext
              # because harfbuzz was installed but never enabled.
              for filter in subtitles drawtext scale crop overlay; do
                if grep -qw -- "$filter" /tmp/filters.txt; then
                  echo "  filter $filter"
                else
                  echo "::error::filter missing: $filter"; fail=1
                fi
              done

              echo "=== -fps_mode, the modern spelling of -vsync ==="
              if "$new" -hide_banner -fps_mode cfr 2>&1 | grep -q "Unrecognized option"; then
                echo "::error::this build wants -vsync, unexpected for 9.x"; fail=1
              else
                echo "  -fps_mode accepted"
              fi

              echo "=== it can actually transcode ==="
              "$new" -hide_banner -loglevel error \
                -f lavfi -i testsrc=duration=2:size=320x240:rate=15 \
                -f lavfi -i sine=frequency=440:duration=2 \
                -c:v libx264 -c:a aac -shortest /tmp/proof.mp4
              ls -l /tmp/proof.mp4

              echo "=== encoders against the bundled build ==="
              "$old" -hide_banner -encoders > /tmp/enc-old-raw.txt 2>/dev/null
              awk "{print \$2}" /tmp/enc-old-raw.txt | sort -u > /tmp/enc-old.txt
              awk "{print \$2}" /tmp/encoders.txt   | sort -u > /tmp/enc-new.txt
              comm -23 /tmp/enc-old.txt /tmp/enc-new.txt | tr "\n" " " > /tmp/lost.txt
              comm -13 /tmp/enc-old.txt /tmp/enc-new.txt | tr "\n" " " > /tmp/gained.txt
              cp /tmp/lost.txt /tmp/gained.txt /w/ 2>/dev/null || true

              exit $fail
            '

      - name: What this build gains and loses against the bundled one
        run: |
          set -uo pipefail
          # Losses we have looked at and accepted, with the reason:
          #   libspeex  alpine packages it nowhere and its configure will not run in
          #             this container. Opus replaced it years ago and is present.
          #   sonic, sonicls, ayuv, v308, v408, v410
          #             native encoders ffmpeg itself dropped between 4.4 and 9.0,
          #             nothing this build can put back.
          allowed='${{ matrix.allowed_losses }}'

          lost=$(cat lost.txt 2>/dev/null || echo '')
          gained=$(cat gained.txt 2>/dev/null || echo '')

          unexpected=''
          for enc in $lost; do
            case " $allowed " in
              *" $enc "*) ;;
              *) unexpected="$unexpected $enc" ;;
            esac
          done

          {
            echo "## ${{ matrix.arch }}: encoders against the bundled build"
            echo
            echo "**Lost:** ${lost:-none}"
            echo
            echo "**Gained:** ${gained:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "lost:       ${lost:-none}"
          echo "gained:     ${gained:-none}"
          echo "unexpected:${unexpected:- none}"

          if [ -n "$unexpected" ]; then
            echo "::error::this build drops encoders the bundled one has:$unexpected"
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.module }}
          path: out/${{ matrix.output }}
          retention-days: 7
          compression-level: 0

      - name: Summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.arch }} ffmpeg ${{ inputs.ffmpeg_version }}"
            echo
            echo '```'
            file -b "out/${{ matrix.output }}" 2>/dev/null || echo "not built"
            echo '```'
            echo
            echo "Commit to \`${{ matrix.module }}/src/main/resources/ws/schild/jave/nativebin/${{ matrix.output }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

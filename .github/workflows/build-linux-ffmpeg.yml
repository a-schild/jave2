# Builds the linux ffmpeg this project bundles, from source, fully static.
#
# Why build at all: the static builds this project has always used are no longer
# reachable, and every other publisher ships dynamically linked binaries. BtbN needs
# glibc 2.28, ffmpeg.martin-riedl.de needs 2.35. Bundling either would drop older
# distributions and musl based images, which work today.
#
# Why musl: linking against musl inside alpine produces a binary with no interpreter
# and no libc dependency at all, so it runs on any linux, glibc distributions and musl
# containers alike. That is a stronger guarantee than the glibc static builds this
# project used before.
#
# Alpine is driven through docker rather than the container: key, because the
# javascript actions need a node that will not run on musl. The build happens in the
# container, everything else on the host.

name: Build linux ffmpeg

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'ffmpeg release to build'
        required: false
        default: '9.0.1'
      alpine_version:
        description: 'alpine image to build in'
        required: false
        default: '3.21'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - name: Build ffmpeg ${{ inputs.ffmpeg_version }} statically against musl
        run: |
          set -euo pipefail
          mkdir -p out

          docker run --rm \
            -v "$PWD/out:/out" \
            -v "$PWD/.github/scripts/build-ffmpeg-static.sh:/build.sh:ro" \
            -e FFMPEG_VERSION="${{ inputs.ffmpeg_version }}" \
            -e OUTPUT_NAME="ffmpeg-amd64" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            "alpine:${{ inputs.alpine_version }}" \
            sh /build.sh

          ls -l out/

      - name: It must be static, or it is no use to us
        run: |
          set -euo pipefail
          description=$(file -b out/ffmpeg-amd64)
          echo "file: $description"

          if ! echo "$description" | grep -q "statically linked"; then
            echo "::error::not statically linked, this would break musl images and older distributions"
            exit 1
          fi
          if echo "$description" | grep -q "interpreter"; then
            echo "::error::names an interpreter, so it is not self contained"
            exit 1
          fi
          echo "OK, self contained"

      - name: Run it on the host, which is glibc, to prove it needs nothing
        run: |
          set -euo pipefail
          ./out/ffmpeg-amd64 -version | head -2

      - name: The features jave actually depends on
        run: |
          set -euo pipefail
          fail=0

          echo "=== https, needed for MultimediaObject on a URL ==="
          if ./out/ffmpeg-amd64 -hide_banner -protocols | grep -qw https; then
            echo "  https present"
          else
            echo "::error::no https protocol, remote sources would stop working"; fail=1
          fi

          echo "=== encoders and filters the test suite exercises ==="
          for enc in libx264 libx265 libmp3lame aac libvorbis flac mpeg4 libopus libvpx-vp9; do
            if ./out/ffmpeg-amd64 -hide_banner -encoders | grep -qw "$enc"; then
              echo "  encoder $enc"
            else
              echo "::error::encoder missing: $enc"; fail=1
            fi
          done
          # AssSubtitlesFilter is part of the public API and has its own test
          if ./out/ffmpeg-amd64 -hide_banner -filters | grep -qw subtitles; then
            echo "  filter subtitles"
          else
            echo "::error::no subtitles filter, libass did not make it in"; fail=1
          fi

          echo "=== -fps_mode, the modern spelling of -vsync ==="
          if ./out/ffmpeg-amd64 -hide_banner -fps_mode cfr 2>&1 | grep -q "Unrecognized option"; then
            echo "::error::this build wants -vsync, unexpected for 9.x"; fail=1
          else
            echo "  -fps_mode accepted"
          fi

          exit $fail

      - name: Actually transcode something
        run: |
          set -euo pipefail
          ./out/ffmpeg-amd64 -hide_banner -loglevel error \
            -f lavfi -i testsrc=duration=2:size=320x240:rate=15 \
            -f lavfi -i sine=frequency=440:duration=2 \
            -c:v libx264 -c:a aac -shortest proof.mp4
          ls -l proof.mp4
          # ffmpeg exits 1 when given no output file, which is what probing with -i is,
          # so do not let that count as the step failing
          { ./out/ffmpeg-amd64 -hide_banner -i proof.mp4 2>&1 || true; } | grep -E "Duration|Stream"

      - name: What this build gains and loses against the bundled 4.4.1
        run: |
          set -uo pipefail
          bundled=jave-nativebin-linux64/src/main/resources/ws/schild/jave/nativebin/ffmpeg-amd64
          chmod +x "$bundled"

          { "$bundled" -version 2>/dev/null || true; } | head -1
          { ./out/ffmpeg-amd64 -version 2>/dev/null || true; } | head -1

          "$bundled" -hide_banner -encoders 2>/dev/null | awk '{print $2}' | sort -u > enc-old.txt
          ./out/ffmpeg-amd64 -hide_banner -encoders 2>/dev/null | awk '{print $2}' | sort -u > enc-new.txt

          lost=$(comm -23 enc-old.txt enc-new.txt | tr '\n' ' ')
          gained=$(comm -13 enc-old.txt enc-new.txt | tr '\n' ' ')

          {
            echo "## Encoders against the bundled 4.4.1"
            echo
            echo "**Lost:** ${lost:-none}"
            echo
            echo "**Gained:** ${gained:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "lost:   ${lost:-none}"
          echo "gained: ${gained:-none}"

          # Parity is the point of building these libraries, so losing one is a failure
          if [ -n "$lost" ]; then
            echo "::error::this build drops encoders the bundled one has: $lost"
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: jave-nativebin-linux64
          path: out/ffmpeg-amd64
          retention-days: 7
          compression-level: 0

      - name: Summary
        if: always()
        run: |
          {
            echo "## linux amd64 ffmpeg ${{ inputs.ffmpeg_version }}"
            echo
            echo '```'
            file -b out/ffmpeg-amd64 2>/dev/null || echo "not built"
            echo '```'
            echo
            echo "Commit to \`jave-nativebin-linux64/src/main/resources/ws/schild/jave/nativebin/ffmpeg-amd64\`"
          } >> "$GITHUB_STEP_SUMMARY"
